{% extends 'base.html' %}
{% block content %}
<!-- ══════════════════════════════════════════════════
     CAMBIAR PASSWORD (2026 AESTHETIC)
══════════════════════════════════════════════════ -->
<div class="min-h-screen bg-[#0B0F19] py-10 px-4 relative overflow-hidden font-sans">
    
    <div class="absolute top-[-20%] left-[-15%] w-[40%] h-[40%] rounded-full bg-amber-600/10 blur-[150px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-15%] w-[40%] h-[40%] rounded-full bg-red-600/10 blur-[150px] pointer-events-none"></div>

    <div class="container mx-auto relative z-10">
        <div class="mb-6">
            {% include 'includes/alerts.html' %}
        </div>

        <div class="flex flex-wrap">
            {% include 'includes/dashboard_sidebar.html' %}

            <main class="w-full md:w-3/4">
                <div class="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-2xl overflow-hidden">
                    <header class="px-8 py-5 border-b border-white/10">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-amber-500/20 rounded-lg flex items-center justify-center">
                                <i class="fas fa-key text-amber-400 text-sm"></i>
                            </div>
                            <strong class="text-gray-200 font-semibold">Cambiar Password</strong>
                        </div>
                    </header>
                    <div class="p-8">
                        <form action="{% url 'change_password' %}" method="post" enctype="multipart/form-data" class="space-y-6 max-w-lg">
                            {% csrf_token %}

                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">Password Actual</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-500 group-focus-within:text-amber-400 transition-colors"></i>
                                    </div>
                                    <input type="password" name="current_password" placeholder="Password Actual" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500/50 transition-all duration-300 backdrop-blur-sm" required>
                                </div>
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">Crear nuevo password</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-500 group-focus-within:text-amber-400 transition-colors"></i>
                                    </div>
                                    <input type="password" name="new_password" placeholder="Nuevo Password" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500/50 transition-all duration-300 backdrop-blur-sm" required>
                                </div>
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">Confirmar nuevo password</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-500 group-focus-within:text-amber-400 transition-colors"></i>
                                    </div>
                                    <input type="password" name="confirm_password" placeholder="Confirmar Nuevo Password" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500/50 transition-all duration-300 backdrop-blur-sm" required>
                                </div>
                            </div>

                            <div class="pt-4">
                                <button type="submit" class="relative group overflow-hidden rounded-2xl px-12">
                                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 opacity-90 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    <div class="relative py-4 text-white font-bold tracking-wider text-sm flex items-center justify-center gap-3">
                                        <span>ACTUALIZAR</span>
                                        <i class="fas fa-sync-alt text-xs group-hover:rotate-180 transition-transform duration-500"></i>
                                    </div>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
{% endblock %}
