{% extends 'base.html' %}
{% block content %}
<!-- ══════════════ CAMBIAR PASSWORD ══════════════ -->
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-10 px-4 font-sans">
    <div class="container mx-auto">
        <div class="mb-6">
            {% include 'includes/alerts.html' %}
        </div>
        <div class="flex flex-wrap">
            {% include 'includes/dashboard_sidebar.html' %}

            <main class="w-full md:w-3/4">
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm overflow-hidden">
                    <header class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-amber-100 dark:bg-amber-900/50 rounded-lg flex items-center justify-center">
                                <i class="fas fa-key text-amber-600 dark:text-amber-400 text-sm"></i>
                            </div>
                            <strong class="text-gray-900 dark:text-white font-semibold">Cambiar Password</strong>
                        </div>
                    </header>
                    <div class="p-6">
                        <form action="{% url 'change_password' %}" method="post" class="space-y-5 max-w-lg">
                            {% csrf_token %}

                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Password Actual</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-amber-500 transition-colors"></i>
                                    </div>
                                    <input type="password" name="current_password" placeholder="Password Actual" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all" required>
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Nuevo Password</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-amber-500 transition-colors"></i>
                                    </div>
                                    <input type="password" name="new_password" placeholder="Nuevo Password" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all" required>
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Confirmar Password</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-amber-500 transition-colors"></i>
                                    </div>
                                    <input type="password" name="confirm_password" placeholder="Confirmar Nuevo Password" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all" required>
                                </div>
                            </div>

                            <div class="pt-4">
                                <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-10 rounded-xl text-sm transition-colors flex items-center justify-center gap-2">
                                    ACTUALIZAR <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
{% endblock %}
