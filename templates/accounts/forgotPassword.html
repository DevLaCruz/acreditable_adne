{% extends 'base.html' %}
{% block content %}
<!-- ══════════════════════════════════════════════════
     FORMULARIO DE RECUPERAR CONTRASEÑA (2026 AESTHETIC)
══════════════════════════════════════════════════ -->
<div class="min-h-screen bg-[#0B0F19] flex items-center justify-center px-4 py-12 relative overflow-hidden font-sans">
    
    <!-- Dynamic Ambient Background Gradients -->
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-pink-600/20 blur-[150px] pointer-events-none animate-pulse" style="animation-duration: 7s;"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-orange-600/20 blur-[150px] pointer-events-none animate-pulse" style="animation-duration: 9s;"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Glassmorphism Card -->
        <div class="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-[2rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] overflow-hidden transition-all duration-500 hover:border-white/20">
            
            <!-- Neon Top Accent -->
            <div class="h-1 w-full bg-gradient-to-r from-pink-500 via-orange-500 to-amber-500"></div>

            <div class="p-10">
                <!-- Brand & Greeting -->
                <div class="flex flex-col items-center mb-10">
                    <div class="w-16 h-16 bg-gradient-to-tr from-pink-500 to-amber-500 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(236,72,153,0.5)] mb-6 transform rotate-3 hover:rotate-0 transition-transform duration-300">
                        <i class="fas fa-key text-3xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-gray-100 to-gray-400 tracking-tight text-center">
                        Recuperar Acceso
                    </h1>
                    <p class="text-gray-400 text-sm mt-2 font-medium tracking-wide text-center">
                        Te enviaremos las instrucciones a tu correo electrónico
                    </p>
                </div>

                <!-- Alerts -->
                <div class="mb-6">
                    {% include 'includes/alerts.html' %}
                </div>

                <!-- Form -->
                <form action="{% url 'forgotPassword' %}" method="POST" class="space-y-6">
                    {% csrf_token %}

                    <!-- Input: Email -->
                    <div class="space-y-2">
                        <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">
                            Correo Electrónico
                        </label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-500 group-focus-within:text-pink-400 transition-colors"></i>
                            </div>
                            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/50 focus:border-pink-500/50 transition-all duration-300 backdrop-blur-sm" required />
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="relative group w-full overflow-hidden rounded-2xl mt-8">
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-pink-600 via-orange-500 to-amber-500 opacity-90 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="relative w-full py-4 text-white font-bold tracking-wider text-sm flex items-center justify-center gap-3">
                            <span>ENVIAR ENLACE</span>
                            <i class="fas fa-paper-plane text-xs group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                        </div>
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center my-8">
                    <div class="flex-1 border-t border-gray-700/50"></div>
                    <span class="mx-4 text-xs font-semibold text-gray-500 uppercase tracking-widest">Opciones</span>
                    <div class="flex-1 border-t border-gray-700/50"></div>
                </div>

                <!-- Login Link -->
                <p class="text-center text-sm text-gray-400">
                    <a href="{% url 'login' %}" class="font-bold text-pink-400 hover:text-pink-300 transition-colors duration-200 ml-1">
                        ← Volver al Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
