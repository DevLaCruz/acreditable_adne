{% extends 'base.html' %}
{% block content %}
<!-- ══════════════ RECUPERAR CONTRASEÑA ══════════════ -->
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4 py-12 font-sans">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg overflow-hidden">
            <div class="h-1 w-full bg-gradient-to-r from-amber-500 to-orange-500"></div>
            <div class="p-8 sm:p-10">
                <div class="flex flex-col items-center mb-8">
                    <div class="w-14 h-14 bg-amber-100 dark:bg-amber-900/50 rounded-xl flex items-center justify-center mb-5">
                        <i class="fas fa-key text-2xl text-amber-600 dark:text-amber-400"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Recuperar Acceso</h1>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 text-center">Te enviaremos las instrucciones a tu correo</p>
                </div>

                {% include 'includes/alerts.html' %}

                <form action="{% url 'forgotPassword' %}" method="POST" class="space-y-5 mt-4">
                    {% csrf_token %}
                    <div class="space-y-1.5">
                        <label for="email" class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Correo Electrónico</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400 dark:text-gray-500 group-focus-within:text-amber-500 transition-colors"></i>
                            </div>
                            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition-all" required />
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl text-sm transition-colors flex items-center justify-center gap-2 mt-4">
                        ENVIAR ENLACE <i class="fas fa-paper-plane text-xs"></i>
                    </button>
                </form>

                <div class="flex items-center my-6">
                    <div class="flex-1 border-t border-gray-200 dark:border-gray-700"></div>
                    <span class="mx-4 text-xs font-medium text-gray-400 dark:text-gray-500">o</span>
                    <div class="flex-1 border-t border-gray-200 dark:border-gray-700"></div>
                </div>

                <p class="text-center text-sm text-gray-500 dark:text-gray-400">
                    <a href="{% url 'login' %}" class="font-bold text-amber-600 dark:text-amber-400 hover:text-amber-500">← Volver al Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
