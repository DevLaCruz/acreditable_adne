{% extends 'base.html' %}
{% block content %}
<!-- ══════════════ RESETEAR CONTRASEÑA ══════════════ -->
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4 py-12 font-sans">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg overflow-hidden">
            <div class="h-1 w-full bg-gradient-to-r from-violet-500 to-cyan-500"></div>
            <div class="p-8 sm:p-10">
                <div class="flex flex-col items-center mb-8">
                    <div class="w-14 h-14 bg-violet-100 dark:bg-violet-900/50 rounded-xl flex items-center justify-center mb-5">
                        <i class="fas fa-redo text-2xl text-violet-600 dark:text-violet-400"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Resetear Contraseña</h1>
                </div>

                {% include 'includes/alerts.html' %}

                <form action="{% url 'resetPassword' %}" method="POST" class="space-y-5 mt-4">
                    {% csrf_token %}

                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Nueva Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-violet-500 transition-colors"></i>
                            </div>
                            <input type="password" name="password" placeholder="Nueva contraseña" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition-all" required />
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider ml-1">Confirmar Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400 dark:text-gray-500 group-focus-within:text-violet-500 transition-colors"></i>
                            </div>
                            <input type="password" name="confirm_password" placeholder="Confirmar contraseña" class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition-all" required />
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3.5 rounded-xl text-sm transition-colors flex items-center justify-center gap-2 mt-4">
                        RESETEAR <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
