{% extends 'base.html' %}
{% block content %}
<!-- ══════════════════════════════════════════════════
     RESETEAR CONTRASEÑA (2026 AESTHETIC)
══════════════════════════════════════════════════ -->
<div class="min-h-screen bg-[#0B0F19] flex items-center justify-center px-4 py-12 relative overflow-hidden font-sans">
    
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-violet-600/20 blur-[150px] pointer-events-none animate-pulse" style="animation-duration: 8s;"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-cyan-600/20 blur-[150px] pointer-events-none animate-pulse" style="animation-duration: 10s;"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="backdrop-blur-xl bg-white/[0.03] border border-white/10 rounded-[2rem] shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] overflow-hidden transition-all duration-500 hover:border-white/20">
            <div class="h-1 w-full bg-gradient-to-r from-violet-500 via-cyan-500 to-teal-500"></div>

            <div class="p-10">
                <div class="flex flex-col items-center mb-10">
                    <div class="w-16 h-16 bg-gradient-to-tr from-violet-500 to-cyan-500 rounded-2xl flex items-center justify-center shadow-[0_0_25px_rgba(139,92,246,0.5)] mb-6 transform rotate-3 hover:rotate-0 transition-transform duration-300">
                        <i class="fas fa-redo text-3xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-gray-100 to-gray-400 tracking-tight text-center">
                        Resetear Contraseña
                    </h1>
                </div>

                <div class="mb-6">
                    {% include 'includes/alerts.html' %}
                </div>

                <form action="{% url 'resetPassword' %}" method="POST" class="space-y-6">
                    {% csrf_token %}

                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">Nueva Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-500 group-focus-within:text-violet-400 transition-colors"></i>
                            </div>
                            <input type="password" name="password" placeholder="Nueva contraseña" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all duration-300 backdrop-blur-sm" required />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest ml-1">Confirmar Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-500 group-focus-within:text-violet-400 transition-colors"></i>
                            </div>
                            <input type="password" name="confirm_password" placeholder="Confirmar contraseña" class="w-full pl-12 pr-4 py-4 bg-gray-900/50 border border-gray-700/50 rounded-2xl text-gray-100 placeholder-gray-600 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all duration-300 backdrop-blur-sm" required />
                        </div>
                    </div>

                    <button type="submit" class="relative group w-full overflow-hidden rounded-2xl mt-8">
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-violet-600 via-cyan-500 to-teal-500 opacity-90 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="relative w-full py-4 text-white font-bold tracking-wider text-sm flex items-center justify-center gap-3">
                            <span>RESETEAR</span>
                            <i class="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
