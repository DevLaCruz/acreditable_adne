{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- SECCIÓN TÍTULO -->
<section class="bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 py-5">
  <div class="container mx-auto px-4">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Nuestra Tienda</h1>
  </div>
</section>

<!-- Spinner global: oculto por defecto, HTMX lo muestra sólo durante la petición -->
<div id="product-spinner"
     class="htmx-indicator"
     style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9998;">
  <div style="width:2.5rem;height:2.5rem;border:4px solid #c7d2fe;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
</div>
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  /* HTMX muestra el indicador añadiendo la clase htmx-request al elemento padre */
  .htmx-indicator { display: none !important; }
  .htmx-request .htmx-indicator,
  .htmx-request.htmx-indicator { display: block !important; }
</style>

<!-- CONTENIDO PRINCIPAL -->
<section class="py-8 bg-slate-50 dark:bg-slate-900 min-h-screen">
  <div class="container mx-auto px-4">
    <div class="flex flex-col md:flex-row gap-6">

      <!-- ── Sidebar Categorías ── -->
      <aside class="w-full md:w-52 flex-shrink-0">
        <div class="bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm sticky top-4">
          <h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-3">Categorías</h2>
          <ul class="space-y-1">
            <li>
              <a href="{% url 'store' %}"
                 hx-get="{% url 'store' %}"
                 hx-target="#product-list"
                 hx-swap="innerHTML"
                 hx-push-url="true"
                 hx-indicator="#product-spinner"
                 class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-xl transition-colors text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950 hover:bg-indigo-100 dark:hover:bg-indigo-900">
                <i class="fas fa-th text-xs"></i> Todos
              </a>
            </li>
            {% for category in links %}
            <li>
              <a href="{{ category.get_url }}"
                 hx-get="{{ category.get_url }}"
                 hx-target="#product-list"
                 hx-swap="innerHTML"
                 hx-push-url="true"
                 hx-indicator="#product-spinner"
                 class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-xl transition-colors text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i class="fas fa-tag text-xs text-slate-400"></i>
                {{ category.category_name }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
      </aside>

      <!-- ── Lista de Productos ── -->
      <main class="flex-1">
        <!-- Contenedor que HTMX reemplaza al navegar -->
        <div id="product-list">
          {% include 'store/partials/product_list.html' %}
        </div>
      </main>

    </div>
  </div>
</section>

{% endblock %}
