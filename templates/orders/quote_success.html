{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-12">
  <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
    <div class="text-center">
      <i class="fas fa-check-circle text-green-500 text-5xl mb-4"></i>
      <h1 class="text-2xl font-bold text-gray-800 mb-4">¡Cotización Lista!</h1>
      <p class="text-gray-600 mb-6">
        Tu solicitud de cotización está lista para ser enviada.
      </p>
      
      <a href="{{ whatsapp_url }}" 
         target="_blank"
         onclick="window.location.href='{% url 'store' %}'"
         class="inline-block bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 mb-4">
        <i class="fab fa-whatsapp mr-2"></i>Enviar por WhatsApp
      </a>
      
      <br>
      <a href="{% url 'store' %}" class="text-blue-500 hover:underline">
        Volver a la tienda
      </a>
    </div>
  </div>
</div>
{% endblock %}
