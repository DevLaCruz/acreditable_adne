    <script>
      document.addEventListener('DOMContentLoaded', function() {

      <style>
        .image-zoom-container {
          position: relative;
          width: 100%;
          cursor: zoom-in;
        }
        
        .zoom-lens {
          position: absolute;
          width: 100px;
          height: 100px;
          border: 2px solid #fff;
          box-shadow: 0 0 5px rgba(0,0,0,0.5);
          background-repeat: no-repeat;
          display: none;
          pointer-events: none;
          border-radius: 50%;
        }
        
        .zoom-result {
          position: absolute;
          top: 0;
          left: 105%;
          width: 400px;
          height: 400px;
          border: 1px solid #ddd;
          background-repeat: no-repeat;
          display: none;
          overflow: hidden;
          background-color: white;
          border-radius: 8px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          z-index: 50;
        }
        
        @media (max-width: 768px) {
          .zoom-result {
            display: none !important;
          }
        }
        </style>

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.image-zoom-container');
            const mainImg = document.getElementById('mainImg');
            const lens = document.querySelector('.zoom-lens');
            const result = document.querySelector('.zoom-result');
            const galleryLinks = document.querySelectorAll('.gallery-link');
            
            let zoomLevel = 2.5;
            
            function updateZoom(e) {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Lens position
                let lensX = x - lens.offsetWidth / 2;
                let lensY = y - lens.offsetHeight / 2;
                
                // Boundaries
                lensX = Math.max(0, Math.min(lensX, container.offsetWidth - lens.offsetWidth));
                lensY = Math.max(0, Math.min(lensY, container.offsetHeight - lens.offsetHeight));
                
                lens.style.left = lensX + 'px';
                lens.style.top = lensY + 'px';
                
                // Result image
                const ratio = zoomLevel;
                result.style.backgroundImage = `url(${mainImg.src})`;
                result.style.backgroundSize = (container.offsetWidth * ratio) + 'px ' + 
                                            (container.offsetHeight * ratio) + 'px';
                result.style.backgroundPosition = `-${lensX * ratio}px -${lensY * ratio}px`;
            }
            
            container.addEventListener('mouseenter', function() {
                lens.style.display = 'block';
                result.style.display = 'block';
            });
            
            container.addEventListener('mouseleave', function() {
                lens.style.display = 'none';
                result.style.display = 'none';
            });
            
            container.addEventListener('mousemove', updateZoom);
            
            // Gallery image switching
            galleryLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const imageUrl = this.getAttribute('data-image');
                    mainImg.src = imageUrl;
                    mainImg.setAttribute('data-zoom-image', imageUrl);
                });
            });
        });
        </script>
