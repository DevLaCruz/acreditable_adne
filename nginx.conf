upstream django_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Logs
    access_log /app/logs/nginx_access.log;
    error_log /app/logs/nginx_error.log;

    # Comprimir respuestas
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/rss+xml application/javascript 
               application/json;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1000;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /health/ {
        access_log off;
        proxy_pass http://django_app;
    }

    # Static files con caché de larga duración
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy a la aplicación Django
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optimización de favicon
    location /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso a archivos de configuración
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
