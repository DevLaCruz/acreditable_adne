[supervisord]
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/logs/nginx_stdout.log
stderr_logfile=/app/logs/nginx_stderr.log
startretries=3

[program:gunicorn]
command=/opt/venv/bin/gunicorn \
    --workers=4 \
    --worker-class=sync \
    --bind=127.0.0.1:8000 \
    --timeout=120 \
    --access-logfile=/app/logs/gunicorn_access.log \
    --error-logfile=/app/logs/gunicorn_error.log \
    --log-level=info \
    TiendaSuarez.wsgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/gunicorn_stdout.log
stderr_logfile=/app/logs/gunicorn_stderr.log
user=appuser
startretries=3

[group:django]
programs=nginx,gunicorn
